services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: footballiq
      POSTGRES_PASSWORD: footballiq
      POSTGRES_DB: footballiq
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U footballiq"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://footballiq:footballiq@db:5432/footballiq
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      # read from a root-level .env file (copy .env.example -> .env) if present;
      # the chatbot simply returns 503 at runtime if this is left empty, so it's
      # fine to run everything else without it set
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - "8000:8000"
    # seed the DB (idempotent - skips if already seeded) before starting the API
    command: >
      sh -c "python -m app.database.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # baked into the JS bundle at build time (see frontend/Dockerfile) -
        # localhost, not the "backend" service name, since the browser calls
        # this directly and isn't part of the Docker network
        VITE_API_URL: http://localhost:8000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
