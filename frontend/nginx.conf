server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        # React Router client-side routing: any path that isn't a real file
        # falls back to index.html, so /players/123 works on a hard refresh.
        try_files $uri $uri/ /index.html;
    }

    # long cache for hashed build assets, none for index.html itself
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
